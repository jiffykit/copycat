<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Copy-Cat</title>
    <style>
/* Copy-Cat 2026. Single authoritative responsive layout. */
:root { color-scheme:dark; --bg:#0c1333; --panel:#161f42; --line:#35456d; --ink:#f5f7ff; --muted:#bdc8e4; --hot:#f7cf73; --keyheight:clamp(192px, 34vw, 320px); }
*,*::before,*::after { box-sizing:border-box; }
html { -webkit-text-size-adjust:100%; }
body { margin:0; min-height:100vh; min-height:100dvh; background:radial-gradient(ellipse at 50% -20%,#303a78 0%,#141d46 44%,#090e29 100%); color:var(--ink); font-family:system-ui,-apple-system,Segoe UI,Arial,sans-serif; }
button,input,select { font:inherit; }
button { -webkit-tap-highlight-color:transparent; }
button:focus-visible,select:focus-visible,input:focus-visible,.option-tag:focus-visible { outline:3px solid #ffcf70; outline-offset:3px; }
[hidden] { display:none!important; }
.game-container { width:min(100%,1040px); margin:0 auto; padding:clamp(12px,2.8vw,28px) clamp(12px,2vw,22px) 38px; display:flex; flex-direction:column; gap:clamp(14px,2vw,24px); }
.game-header { text-align:center; position:relative; height:330px; display:grid; grid-template-rows:90px 34px 190px; justify-items:center; align-items:center; gap:8px; flex-shrink:0; }
.brand { height:92px; width:100%; display:flex; align-items:center; justify-content:center; }
.brand img { display:block; max-width:100%; max-height:90px; width:auto; object-fit:contain; filter:drop-shadow(0 7px 20px #0007); }
.brand h1 { margin:0; letter-spacing:.10em; font-size:clamp(2.3rem,6vw,4.8rem); font-weight:900; color:#f5f7ff; text-shadow:0 4px 0 #293063,0 10px 24px #0008; }
.brand h1 span { color:#ffca62; }
#playerNameDisplay { width:fit-content; margin:0 auto!important; height:32px; max-width:100%; font-size:1rem!important; color:#c6d5ff!important; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
#preGameUI,#inGameUI { width:100%; height:192px; flex-shrink:0; }
.controls { display:flex; justify-content:center; align-items:center; gap:10px; flex-wrap:wrap; padding:2px 0; min-height:49px; }
.btn { cursor:pointer; border:1px solid #687cb0; background:#243665; color:white; border-radius:12px; padding:11px 17px; font-size:.95rem; font-weight:700; line-height:1.2; min-height:45px; transition:background-color .13s ease,border-color .13s ease; white-space:nowrap; }
.btn:hover:not(:disabled) { background:#364e89; border-color:#bacbf4; }
.btn:active:not(:disabled) { background:#5568a0; }
.btn.primary { background:#f9c767; color:#172245; border-color:#ffdd99; }
.btn.primary:hover { background:#ffe08c; }
.btn.special { background:#364a85; }
.btn.secondary { background:#2f345b; }
.btn.info { background:#234a70; }
.btn:disabled { opacity:.48; cursor:not-allowed; }
.game-info { display:flex; justify-content:center; gap:8px; flex-wrap:wrap; padding:0 0 8px; }
.game-info .score { flex:0 1 auto; min-width:114px; background:#111a39; color:#bfcce8; border:1px solid #3b4e77; border-radius:11px; padding:9px 12px; font-size:clamp(.82rem,2vw,1rem); }
.game-info .score span { color:#fff; font-weight:800; }
.options-indicator { display:flex; justify-content:center; flex-wrap:wrap; align-items:center; gap:8px; min-height:42px; padding:6px 0; }
.option-tag { user-select:none; background:#1c2954; color:#dce8ff; border:1px solid #42547e; font-size:.82rem; font-weight:600; padding:8px 11px; border-radius:11px; cursor:pointer; }
.option-tag:hover { background:#263968; }
.option-tag.pulse { animation:rhythmPulse .6s ease-in-out; }
#preGameUI > div[style*="text-align: center"] { margin:5px 0!important; }
#myOwnNotesCheckboxContainer { border:1px solid #5a77a3!important; color:var(--ink)!important; background:#202d56!important; font-size:.87rem!important; }
#myOwnNotesCheckboxContainer input { accent-color:#e8a84b; }
.rhythm-controls,.scale-controls { display:none; }
.game-board { display:flex!important; flex-direction:column; align-items:center; gap:12px; width:100%; margin:0; padding:clamp(12px,2vw,24px); background:#111a37; border:1px solid #3a4a75; box-shadow:0 12px 45px #0003; border-radius:20px; }
.keyboard-heading,.keyboard-legend { width:100%; display:flex; justify-content:space-between; gap:10px; flex-wrap:wrap; align-items:center; }
.keyboard-heading { font-weight:750; letter-spacing:.1em; font-size:.84rem; color:#e1e9ff; }
#keyboardHint { font-size:.81rem; letter-spacing:0; font-weight:500; color:#aebfe0; text-align:right; }
.keyboard-tools { display:flex; align-items:center; gap:12px; }
.audio-settings-btn { display:grid; place-items:center; width:36px; height:36px; flex:none; padding:0; border:1px solid #5e719d; background:#1c2954; color:#e8f0ff; border-radius:10px; font-size:1.48rem; line-height:1; cursor:pointer; }
.audio-settings-btn:hover,.audio-settings-btn[aria-expanded="true"] { color:#1b2748; background:#f4ca72; border-color:#ffdb9b; }
.notes-container { width:100%; height:var(--keyheight); position:relative; isolation:isolate; touch-action:none; user-select:none; -webkit-user-select:none; border-radius:7px; overflow:hidden; background:#050814; border:clamp(3px,.65vw,6px) solid #070d25; box-shadow:0 9px 0 #030711,0 16px 24px #0008; }
.piano-key { appearance:none; -webkit-appearance:none; padding:0; margin:0; position:absolute; top:0; border-radius:0 0 7px 7px; display:flex; justify-content:center; align-items:flex-end; overflow:hidden; cursor:pointer; touch-action:none; transition:none; transform:none!important; font-weight:700; }
.piano-key.white { width:12.5%; height:100%; z-index:1; background:linear-gradient(180deg,#e9eaf1 0%,#fdfdff 58%,#d7d8df 100%); color:#27304b; border:1px solid #8c91a5; box-shadow:inset 0 -6px 6px #686e7930; }
.piano-key.black { width:7.7%; height:64%; z-index:3; background:linear-gradient(100deg,#1e2442,#060914 60%,#30394f); color:#f3f6ff; border:1px solid #02030a; border-radius:0 0 6px 6px; box-shadow:2px 5px 6px #0009,inset 0 -3px 2px #5a6172; }
.light-number { display:block; padding-bottom:clamp(10px,2vw,21px); font-size:clamp(.61rem,1.35vw,.96rem); pointer-events:none; white-space:nowrap; }
.black .light-number { padding-bottom:clamp(8px,2vw,15px); font-size:clamp(.54rem,1.1vw,.79rem); }
.piano-key.out-of-scale:not(.playing):not(.active):not(.selected) { filter:grayscale(1) brightness(.62); cursor:pointer; }
.piano-key.black.out-of-scale:not(.playing):not(.active):not(.selected) { filter:grayscale(1) brightness(.75); }
.piano-key.selected { outline:3px solid #f7c666; outline-offset:-4px; }
.piano-key.white.playing,.piano-key.white.active,.piano-key.black.playing,.piano-key.black.active { background:var(--note-glow,#f2ae41)!important; color:#0c1230; border-color:#fff9!important; box-shadow:inset 0 0 27px #ffffff88,0 0 22px var(--note-glow,#f2ae41); filter:none!important; z-index:4; }
.piano-key.black.playing,.piano-key.black.active { z-index:5; }
.keyboard-legend { justify-content:center; gap:14px; font-size:.76rem; color:#a9b9dc; padding-top:5px; }
.keyboard-legend span { display:flex; align-items:center; gap:5px; }
.legend-dot { display:inline-block; width:9px; height:9px; border-radius:3px; background:#fafbff; }
.legend-dot.unavailable { background:#787c8e; }
.legend-dot.lit { background:linear-gradient(90deg,#f6534b,#ffd053,#41d996,#547cf5,#9869df); }
/* Floating settings do not resize or move the keyboard when opened. */
.midi-panel { position:fixed; top:clamp(12px,15vh,170px); right:max(12px,calc((100vw - 1040px) / 2 + 16px)); z-index:60; width:min(600px,calc(100vw - 24px)); max-height:calc(100dvh - 32px); overflow-y:auto; padding:15px clamp(12px,2vw,20px); border:1px solid #7087b3; background:#131d40; border-radius:16px; box-shadow:0 18px 60px #000c; }
.midi-panel-header { display:flex; align-items:center; justify-content:space-between; gap:8px; margin-bottom:12px; flex-wrap:wrap; }
.midi-panel-header strong { font-size:1rem; }
.audio-settings-close { min-height:36px; padding:6px 12px; color:#e8f0ff; border:1px solid #6c7fac; border-radius:9px; background:#243665; cursor:pointer; }
.audio-settings-close:hover { background:#354a81; }
#midiStatus { flex-basis:100%; }
#midiStatus { font-size:.8rem; color:#b3c7eb; }
.midi-controls { display:flex; flex-wrap:wrap; align-items:end; gap:10px; }
.midi-field { display:flex; flex:1 1 180px; min-width:160px; flex-direction:column; gap:5px; font-size:.72rem; letter-spacing:.07em; font-weight:700; color:#cbd5ef; }
.midi-field select { height:42px; min-width:0; max-width:100%; padding:0 10px; color:#f8faff; border:1px solid #576b95; border-radius:9px; background:#1e2a52; font-size:.86rem; }
.midi-field select:disabled { opacity:.55; }
.btn.midi-connect { height:42px; min-height:42px; font-size:.85rem; }
.midi-checkbox { display:flex; align-items:center; gap:6px; min-height:42px; font-size:.83rem; white-space:nowrap; color:#cbd8f3; cursor:pointer; }
.midi-checkbox input { width:17px; height:17px; margin:0; accent-color:#f8ca72; }
.save-custom-notes-btn { display:block; position:fixed; bottom:calc(16px + env(safe-area-inset-bottom)); left:50%; transform:translateX(-50%); z-index:999; padding:14px 26px; color:#17213c; background:#ffce72; border:2px solid white; border-radius:12px; font-weight:800; box-shadow:0 8px 28px #0009; cursor:pointer; }
.rhythm-toggles,.scale-options,.game-mode-options,.note-toggles { display:flex; flex-wrap:wrap; justify-content:center; gap:10px; }
.rhythm-controls label,.scale-controls label { display:inline-flex; align-items:center; gap:6px; color:#202540; background:#fff7e7; border:1px solid #e2d4b0; border-radius:9px; padding:7px 10px; cursor:pointer; font-size:.92rem; }
.rhythm-controls h4,.scale-controls h4 { margin:8px 0; color:#172343; }
.modal-with-scroll { overscroll-behavior:contain; }
.game-overlay { box-sizing:border-box; max-width:100vw; max-height:100dvh; overflow:auto; }
.game-overlay > div:not(.welcome-dialog) { box-sizing:border-box; max-width:min(92vw,540px)!important; min-width:0!important; max-height:min(88dvh,820px); overflow-y:auto; overflow-x:hidden; }
/* Welcome dialog: natural height and no internal scrollbar. On very short
   screens the overlay itself remains swipe-scrollable, with hidden track. */
.welcome-overlay { position:fixed; inset:0; z-index:10001; display:flex; justify-content:center; align-items:initial; overflow-y:auto; overflow-x:hidden; padding:max(10px,env(safe-area-inset-top)) 12px max(10px,env(safe-area-inset-bottom)); background:linear-gradient(135deg,#667eea,#764ba2); backdrop-filter:blur(10px); scrollbar-width:none; }
.welcome-overlay::-webkit-scrollbar { display:none; }
.welcome-dialog { flex:0 0 auto; margin:auto; width:min(100%,500px); max-width:100%; max-height:none; overflow:visible; padding:clamp(16px,2.8vh,26px); text-align:center; color:#2d3436; background:linear-gradient(135deg,#ffeaa7,#fab1a0); border:3px solid white; border-radius:20px; box-shadow:0 20px 40px #0005; animation:fadeInUp .6s ease-out; }
.welcome-logo { display:block; width:auto; max-width:100%; max-height:clamp(52px,8vh,76px); object-fit:contain; margin:0 auto clamp(6px,1.3vh,12px); }
.welcome-greeting { font-size:clamp(1rem,2.5vw,1.2rem); line-height:1.35; margin-bottom:clamp(10px,1.9vh,17px); }
.welcome-instructions { text-align:left; background:#fffc; border-radius:15px; padding:clamp(12px,2.3vh,19px); margin-bottom:clamp(9px,1.7vh,15px); font-size:clamp(.83rem,2vw,1rem); line-height:1.35; }
.welcome-instructions p { margin:0 0 9px; }
.welcome-instructions p:first-child { font-size:1.08em; margin-bottom:12px; }
.welcome-instructions p:last-child { margin-bottom:0; }
.welcome-name-row { margin-bottom:clamp(10px,2vh,16px); }
.welcome-name-input { width:min(100%,365px); padding:10px 16px; border:2px solid #ddd; border-radius:25px; font-size:1rem; text-align:center; }
.welcome-actions { display:flex; gap:10px; justify-content:center; flex-wrap:wrap; }
.welcome-actions button { min-height:42px; }
@media (max-height:640px) { .welcome-dialog {padding:12px;} .welcome-logo{max-height:49px; margin-bottom:5px;} .welcome-greeting{margin-bottom:8px;} .welcome-instructions{padding:10px;margin-bottom:8px;} .welcome-instructions p{margin-bottom:6px;} .welcome-name-row{margin-bottom:8px;} .welcome-actions{gap:6px;} }
.game-overlay input[type="text"] { max-width:100%; }
@keyframes rhythmPulse { 50% { box-shadow:0 0 0 5px #fcd06b80; } }
@keyframes fadeInUp { from { opacity:0;transform:translateY(22px); } to {opacity:1;transform:translateY(0);} }
@keyframes scoreReveal { to {opacity:1;transform:translateY(0);} }
@keyframes colorCycle {0%{color:#ff5e62}25%{color:#ffcf65}50%{color:#55dfbe}75%{color:#8c96fc}100%{color:#fa7fda}}
@keyframes gradientShift {0%{background-position:0 50%}50%{background-position:100% 50%}100%{background-position:0 50%}}
@keyframes bonusPulse { 0%{transform:translate(-50%,-50%) scale(.85);opacity:0}100%{transform:translate(-50%,-50%) scale(1);opacity:1} }
@keyframes slideInRight {from{transform:translateX(100%);opacity:0}to{transform:translateX(0);opacity:1}}
@keyframes pulse { from {transform:scale(1)}to{transform:scale(1.04)} }
@media (max-width:650px) {
 :root { --keyheight:clamp(175px,47vw,260px); }
 .game-container { padding:12px 9px 22px; gap:12px; }
 .game-header { height:332px; grid-template-rows:80px 34px 202px; }
 .brand {height:80px}
 .brand img {max-height:78px}
 #preGameUI,#inGameUI {height:202px}
 .controls {gap:7px}
 .btn {padding:10px 11px;font-size:.83rem;min-height:43px}
 .game-info {gap:5px}
 .game-info .score {min-width:96px;padding:8px 6px;font-size:.78rem}
 .option-tag {font-size:.73rem;padding:7px}
 .game-board {padding:11px 8px 17px;border-radius:12px}
 .keyboard-heading {font-size:.7rem}
 .keyboard-tools {gap:7px}
 .audio-settings-btn {width:34px;height:34px}
 #keyboardHint {font-size:.72rem}
 .keyboard-legend {font-size:.65rem;gap:8px}
 .light-number {font-size:.65rem}
 .black .light-number {font-size:.54rem;writing-mode:vertical-rl;transform:rotate(180deg);padding:0 0 7px}
 .midi-panel {padding:12px 10px}
 .midi-field {min-width:130px;flex-basis:130px}
 .midi-checkbox {min-height:28px}
 .game-overlay > div {padding:min(6vw,22px)!important;width:92vw!important}
}
@media (max-width:380px) {
 .game-header {height:341px;grid-template-rows:80px 34px 211px}
 #preGameUI,#inGameUI {height:211px}
 .midi-field {flex-basis:100%;}
}
@media (orientation:landscape) and (max-height:550px) { :root {--keyheight:185px;} .game-container{max-width:900px;} .game-header{height:280px;grid-template-rows:56px 34px 174px;} .brand{height:56px} .brand img{max-height:54px} #preGameUI,#inGameUI{height:174px} }
@media (prefers-reduced-motion:reduce) {*,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important;} }

    </style>
</head>

<body>
    <div class="game-container">
        <header class="game-header">
            <div class="brand"><img src="Copycat logo.png" alt="Copy-Cat" onload="this.nextElementSibling.hidden=true" onerror="this.hidden=true;this.nextElementSibling.hidden=false"><h1>COPY<span>CAT</span></h1></div>

            <!-- Player name display -->
            <div id="playerNameDisplay"
                style="text-align: center; margin: 10px 0; font-size: 1.2rem; font-weight: bold; color: #6c5ce7; display: none; cursor: pointer; transition: all 0.2s; padding: 5px 10px; border-radius: 15px;"
                onmouseover="this.style.backgroundColor='rgba(108, 92, 231, 0.1)'; this.style.transform='scale(1.05)'"
                onmouseout="this.style.backgroundColor='transparent'; this.style.transform='scale(1)'"
                title="Click to view your progress and statistics">
                ⭐ <span id="currentPlayerName"></span>
            </div>

            <!-- PRE-GAME UI (shown when game is stopped) -->
            <div id="preGameUI">
                <!-- Main controls for starting the game -->
                <div class="controls">
                    <button id="startBtn" class="btn primary">🎮 Start Game</button>
                    <button id="optionsBtn" class="btn special">⚙️ Options</button>
                    <button id="helpBtn" class="btn info">❓ Help</button>
                </div>

                <!-- Options indicator - pre-game -->
                <div class="options-indicator" id="optionsIndicator">
                    <div class="option-tag rhythm-tag">Rhythms: ♩</div>
                    <div class="option-tag note-tag">Notes: Adventure</div>
                    <div class="option-tag sound-tag">🔊 Sound FX</div>
                </div>

                <!-- My Own Notes checkbox - pre-game only -->
                <div style="text-align: center; margin: 10px 0;">
                    <label id="myOwnNotesCheckboxContainer"
                        style="display: inline-flex; align-items: center; background: rgba(255,255,255,0.95); color: #2d3436; padding: 8px 15px; border-radius: 12px; cursor: pointer; font-size: 1rem; border: 2px solid #ddd; transition: all 0.2s; font-weight: 500;">
                        <input type="checkbox" id="useMyOwnNotesGlobal"
                            style="margin-right: 8px; transform: scale(1.2);">
                        <span>🎨 Use My Own Notes</span>
                    </label>
                </div>
            </div>

            <!-- IN-GAME UI (shown when game is running) -->
            <div id="inGameUI" style="display: none;">
                <!-- Game info display -->
                <div class="game-info">
                    <div class="score">Score: <span id="totalScore">0</span></div>
                    <div class="score"><span id="stageLabel">Level</span>: <span id="currentLevel">1</span> · <span id="round">1</span></div>
                    <div class="score">Lives: <span id="lives">3</span></div>
                </div>

                <!-- In-game options indicator - minimal -->
                <div class="options-indicator in-game">
                    <div class="option-tag rhythm-tag">Rhythms: ♩</div>
                    <div class="option-tag sound-tag">🔊 Sound FX</div>
                </div>

                <!-- In-game controls -->
                <div class="controls">
                    <button id="stopResetBtn" class="btn secondary">🛑 Stop/Reset</button>
                    <button id="listenAgainBtn" class="btn special" disabled>👂 Listen Again</button>
                </div>
            </div>

            <!-- Hidden options (moved to modal) -->
            <div class="rhythm-controls" style="display: none;">
                <h4>🎵 Rhythm Options:</h4>
                <div class="rhythm-toggles">
                    <label><input type="checkbox" id="rhythmQuarter" checked> ♩ - ¹⁄₄ notes (🟣 PLUM) </label>
                    <label><input type="checkbox" id="rhythmEighth"> ♫ - ¹⁄₈ notes (🍎APPLE) </label>
                </div>
                <div class="rhythm-toggles" style="margin-top: 10px;">
                    <label><input type="checkbox" id="rhythmTriplet"> ³ - Triplets (🍍PINEAPPLE) </label>
                    <label><input type="checkbox" id="rhythmSixteenth"> ♬ - ¹⁄₁₆ notes (🍉WATERMELON) </label>
                </div>
            </div>
            <div class="scale-controls" style="display: none;">
                <h4>🎹 Note Options:</h4>
                <div class="scale-options">
                    <label><input type="radio" name="scaleType" value="progressive" checked> Adventure notes</label>
                    <label><input type="radio" name="scaleType" value="custom"> 🎨 My Own Notes</label>
                    <label><input type="checkbox" id="muteCheeringSound" checked> 🔊 Sound FX</label>
                </div>
                <div class="game-mode-options" style="margin-top: 10px;">
                    <button class="game-mode-toggle" id="gameModeToggle">Adventure Mode</button>
                </div>
                <div class="custom-scale" id="customScaleContainer" style="display: none;">
                    <div class="note-toggles">
                        <label><input type="checkbox" id="noteC" checked> C</label>
                        <label><input type="checkbox" id="noteCsharp"> C#</label>
                        <label><input type="checkbox" id="noteD"> D</label>
                        <label><input type="checkbox" id="noteDsharp"> D#</label>
                        <label><input type="checkbox" id="noteE" checked> E</label>
                        <label><input type="checkbox" id="noteF"> F</label>
                        <label><input type="checkbox" id="noteFsharp"> F#</label>
                        <label><input type="checkbox" id="noteG" checked> G</label>
                        <label><input type="checkbox" id="noteGsharp"> G#</label>
                        <label><input type="checkbox" id="noteA"> A</label>
                        <label><input type="checkbox" id="noteAsharp"> A#</label>
                        <label><input type="checkbox" id="noteB"> B</label>
                         <label><input type="checkbox" id="noteC4"> C4</label>
                    </div>
                </div>
            </div>
        </header>

        <main class="game-board show" aria-label="Copy-Cat piano game">
            <div class="keyboard-heading"><span>PIANO · C3–C4</span><div class="keyboard-tools"><span id="keyboardHint">Tap a key to hear it</span><button type="button" id="audioSettingsBtn" class="audio-settings-btn" aria-label="Audio and MIDI settings" aria-controls="midiPanel" aria-expanded="false" title="Audio and MIDI settings">⚙</button></div></div>
            <div class="notes-container" id="pianoKeyboard" role="group" aria-label="One octave piano keyboard, C3 through C4">
                <button type="button" class="light piano-key white" id="light-0" data-note="C" data-midi="48" aria-label="C3" style="left:0.0%;"><span class="light-number">C3</span></button>
                <button type="button" class="light piano-key black" id="light-1" data-note="C#" data-midi="49" aria-label="C♯3" style="left:8.65%;"><span class="light-number">C♯3</span></button>
                <button type="button" class="light piano-key white" id="light-2" data-note="D" data-midi="50" aria-label="D3" style="left:12.5%;"><span class="light-number">D3</span></button>
                <button type="button" class="light piano-key black" id="light-3" data-note="D#" data-midi="51" aria-label="D♯3" style="left:21.15%;"><span class="light-number">D♯3</span></button>
                <button type="button" class="light piano-key white" id="light-4" data-note="E" data-midi="52" aria-label="E3" style="left:25.0%;"><span class="light-number">E3</span></button>
                <button type="button" class="light piano-key white" id="light-5" data-note="F" data-midi="53" aria-label="F3" style="left:37.5%;"><span class="light-number">F3</span></button>
                <button type="button" class="light piano-key black" id="light-6" data-note="F#" data-midi="54" aria-label="F♯3" style="left:46.15%;"><span class="light-number">F♯3</span></button>
                <button type="button" class="light piano-key white" id="light-7" data-note="G" data-midi="55" aria-label="G3" style="left:50.0%;"><span class="light-number">G3</span></button>
                <button type="button" class="light piano-key black" id="light-8" data-note="G#" data-midi="56" aria-label="G♯3" style="left:58.65%;"><span class="light-number">G♯3</span></button>
                <button type="button" class="light piano-key white" id="light-9" data-note="A" data-midi="57" aria-label="A3" style="left:62.5%;"><span class="light-number">A3</span></button>
                <button type="button" class="light piano-key black" id="light-10" data-note="A#" data-midi="58" aria-label="A♯3" style="left:71.15%;"><span class="light-number">A♯3</span></button>
                <button type="button" class="light piano-key white" id="light-11" data-note="B" data-midi="59" aria-label="B3" style="left:75.0%;"><span class="light-number">B3</span></button>
                <button type="button" class="light piano-key white" id="light-12" data-note="C4" data-midi="60" aria-label="C4" style="left:87.5%;"><span class="light-number">C4</span></button>
            </div>
            <div class="keyboard-legend"><span><i class="legend-dot available"></i> Available</span><span><i class="legend-dot unavailable"></i> CPU won't use</span><span><i class="legend-dot lit"></i> Playing</span></div>
        </main>
        <section id="midiPanel" class="midi-panel" aria-label="Sound and MIDI settings" hidden>
            <div class="midi-panel-header"><strong>Audio & MIDI</strong><button type="button" id="closeAudioSettingsBtn" class="audio-settings-close" aria-label="Close audio and MIDI settings">Close</button><span id="midiStatus" role="status" aria-live="polite">Onboard audio ready · MIDI not connected</span></div>
            <div class="midi-controls">
                <label class="midi-field"><span>MIDI IN</span><select id="midiInput" aria-label="MIDI input device" disabled><option value="">No input</option></select></label>
                <label class="midi-field"><span>MIDI OUT</span><select id="midiOutput" aria-label="MIDI output device" disabled><option value="">No output</option></select></label>
                <button type="button" class="btn midi-connect" id="connectMidiBtn">Connect MIDI</button>
                <label class="midi-checkbox"><input type="checkbox" id="onboardAudio" checked> Onboard sound</label>
                <label class="midi-checkbox"><input type="checkbox" id="midiThru"> MIDI Thru</label>
            </div>
        </section>
    </div>

    <script>// Memory Rhythm Game - Main JavaScript File

        class MemoryRhythmGame {
            constructor() {
                // Player management
                this.playerName = '';
                this.player2Name = ''; // For 2-player mode
                this.playerStats = {
                    totalGamesPlayed: 0,
                    bestLevel: 1,
                    bestScore: 0,
                    rhythmAccuracyHistory: [],
                    pitchAccuracyHistory: [],
                    sessionScores: []
                };
                this.gameStarted = false; // Track if welcome flow is complete

                this.audioContext = null;
                this.masterGain = null;
                this.gameSequence = [];
                this.playerSequence = [];
                this.currentRound = 1;
                this.gameState = 'stopped'; // 'stopped', 'playing', 'listening', 'waiting'
                this.bpm = 50; // Start at 50 BPM, increases by 2 per level, max 85
                this.sequenceTimeout = null;
                this.playerTimeout = null;
                this.isPlayerTurn = false;
                this.currentSequenceIndex = 0; // Track which item in sequence player is on
                this.currentTapCount = 0; // Track taps for current item
                this.tapStartTime = 0; // Track when player started tapping current item
                this.currentItemStartTime = 0; // Track when current sequence item started
                this.currentItemTapTimes = []; // Track individual tap times for current item
                this.usingCustomScale = false; // Track if using custom scale
                this.customNotes = ['C', 'E', 'G']; // Default custom scale
                this.customNoteSelectionMode = false; // Track if in interactive note selection mode
                this.enabledRhythms = ['quarter']; // Synced from the controls
                this.currentLevel = 1; // Current level (affects available notes)
                this.correctInRow = 0; // Track consecutive correct answers
                this.lastNoteIndex = -1; // Track last note to avoid repetition
                this.lives = 3; // Start with 3 lives

                // Game mode settings
                this.gameMode = 'adventure'; // 'adventure', 'normal', 'pitch-training', 'call-response'
                this.callResponseMode = false; // 2-player call and response mode
                this.pitchTrainingMode = false; // Pitch training mode
                this.isPlayer1Turn = true; // Track whose turn in call and response
                this.player1Sequence = []; // Store player 1's performance for comparison
                this.pitchTrainingListenCount = 0; // Track Listen Again uses in pitch training
                this.callResponseRound = 1; // Track round number for call & response mode

                // Listen Again bonus system
                this.normalListenAgainCount = 1; // Normal mode gets 1 Listen Again per level
                this.bonusListenAgainAwarded = false; // Track if bonus was awarded this level

                // Quick access rhythm cycling system
                this.rhythmCombinations = [
                    ['quarter'],
                    ['eighth'],
                    ['triplet'],
                    ['sixteenth'],
                    ['quarter', 'eighth'],
                    ['quarter', 'sixteenth'],
                    ['eighth', 'sixteenth'],
                    ['sixteenth', 'triplet'],
                    ['quarter', 'eighth', 'sixteenth'],
                    ['eighth', 'triplet', 'sixteenth'],
                    ['quarter', 'eighth', 'triplet'],
                    ['quarter', 'eighth', 'triplet', 'sixteenth']
                ];
                this.currentRhythmComboIndex = 0; // Start with just quarter notes

                // Note cycling system for quick access
                this.noteOptions = [
                    'progression', // Adventure progression
                    'custom'       // Custom notes
                ];
                this.currentNoteOptionIndex = 0; // Start with progression

                // Scoring system
                this.totalScore = 0;
                this.levelScore = 0;
                this.rhythmAccuracy = 0;
                this.perfectTimingCount = 0;
                this.totalTimingAttempts = 0;
                this.levelTimingAttempts = 0;
                this.levelRhythmAccuracySum = 0;
                this.sessionRhythmAccuracySum = 0; // Sum of all rhythm accuracy scores this session
                this.currentLevelRhythmBonus = 0; // Track rhythm bonus for current level only
                this.listenAgainUsed = false; // Track if Listen Again has been used this level

                // Level requirements: sequence length progression (3→4→4→5→5→6→6→7 etc.)
                this.levelRequirements = {
                    1: 3, // Level 1: 3 notes to complete
                    2: 4, // Level 2: 4 notes to complete
                    3: 4, // Level 3: 4 notes to complete (including A)
                    4: 5, // Level 4: 5 notes to complete
                    5: 5, // Level 5: 5 notes to complete
                    6: 6, // Level 6: 6 notes to complete  
                    7: 6, // Level 7: 6 notes to complete
                    8: 7, // Level 8: 7 notes to complete
                    9: 7, // Level 9: 7 notes to complete
                    10: 8, // Level 10: 8 notes to complete
                    11: 8, // Level 11: 8 notes to complete
                    12: 9, // Level 12: 9 notes to complete
                    13: 9, // Level 13: 9 notes to complete
                    14: 10, // Level 14: 10 notes to complete
                    15: 10, // Level 15: 10 notes to complete
                    16: 11, // Level 16: 11 notes to complete
                    17: 11, // Level 17: 11 notes to complete
                    18: 12, // Level 18: 12 notes to complete (max)
                    19: 12, // Level 19: 12 notes to complete
                    20: 12 // Level 20: 12 notes to complete
                };

                // Progressive note system by level - slower progression
                this.levelNotes = {
                    1: ['C', 'E', 'G'], // Level 1: CEG (3 notes)
                    2: ['C', 'E', 'G'], // Level 2: CEG (3 notes) 
                    3: ['C', 'E', 'G', 'A'], // Level 3: CEGA (4 notes)
                    4: ['C', 'E', 'G', 'A'], // Level 4: CEGA (4 notes)
                    5: ['C', 'E', 'G', 'A', 'D'], // Level 5: CEGAD (5 notes)
                    6: ['C', 'E', 'G', 'A', 'D'], // Level 6: CEGAD (5 notes)
                    7: ['C', 'D', 'E', 'G', 'A', 'F'], // Level 7: CDEGAF (6 notes)
                    8: ['C', 'D', 'E', 'G', 'A', 'F'], // Level 8: CDEGAF (6 notes)
                    9: ['C', 'D', 'E', 'F', 'G', 'A', 'B'], // Level 9: CDEFGAB (7 notes)
                    10: ['C', 'D', 'E', 'F', 'G', 'A', 'B'], // Level 10: CDEFGAB (7 notes)
                    11: ['C', 'D', 'D#', 'E', 'F', 'G', 'A', 'B'], // Level 11: Add D# (8 notes)
                    12: ['C', 'D', 'D#', 'E', 'F', 'G', 'A', 'B'], // Level 12: Add D# (8 notes)
                    13: ['C', 'D', 'D#', 'E', 'F', 'G', 'G#', 'A', 'B'], // Level 13: Add G# (9 notes)
                    14: ['C', 'D', 'D#', 'E', 'F', 'G', 'G#', 'A', 'B'], // Level 14: Add G# (9 notes)
                    15: ['C', 'D', 'D#', 'E', 'F', 'F#', 'G', 'G#', 'A', 'B'], // Level 15: Add F# (10 notes)
                    16: ['C', 'D', 'D#', 'E', 'F', 'F#', 'G', 'G#', 'A', 'B'], // Level 16: Add F# (10 notes)
                    17: ['C', 'D', 'D#', 'E', 'F', 'F#', 'G', 'G#', 'A', 'A#', 'B'], // Level 17: Add A# (11 notes)
                    18: ['C', 'D', 'D#', 'E', 'F', 'F#', 'G', 'G#', 'A', 'A#', 'B'], // Level 18: Add A# (11 notes)
                    19: ['C', 'C#', 'D', 'D#', 'E', 'F', 'F#', 'G', 'G#', 'A', 'A#', 'B'], // Level 19: all 12 pitch classes
                    20: ['C', 'C#', 'D', 'D#', 'E', 'F', 'F#', 'G', 'G#', 'A', 'A#', 'B', 'C4'] // Level 20: Full chromatic
                };

                // Rhythm definitions - simplified
                this.rhythms = {
                    quarter: { taps: 1, symbol: '♩', name: 'Quarter' },
                    eighth: { taps: 2, symbol: '♫', name: 'Eighth' },
                    triplet: { taps: 3, symbol: '³', name: 'Triplet' },
                    sixteenth: { taps: 4, symbol: '♬', name: 'Sixteenth' }
                };

                // Shepard tone frequencies for one octave
                this.notes = {
                    'C': 130.81, 'C#': 138.59, 'D': 146.83, 'D#': 155.56,
                    'E': 164.81, 'F': 174.61, 'F#': 185.00, 'G': 196.00,
                    'G#': 207.65, 'A': 220.00, 'A#': 233.08, 'B': 246.94, 'C4': 261.63
                };

                this.pendingTimers = new Set();
                this.midiAccess = null;
                this.midiInPort = null;
                this.midiOutPort = null;
                this.midiOnNotes = new Set();
                this.pointerNotes = new Set();
                this.midiOutChannel = 0;
                this.midiEnabled = false;
                this.midiRequestPending = false;
                this.pitchAttempts = 0;
                this.pitchCorrect = 0;
                this.sequenceCompletionPending = false;
                this.adventureTargetSequence = [];
                this.lastAdventureFirstNote = null;
                this.midiInHandler = event => this.handleMIDIMessage(event);
                this.initializeAudio();
                this.initializeEventListeners();
                this.initializeMIDIControls();
                this.updateEnabledRhythms(); // Initialize rhythm settings
                this.updateDisplay();
                this.updateNoteDisplay();
                this.updateOptionsIndicator(); // Initialize options indicator
                this.updateLightColors(); // Initialize level 1 colors (blue)

                // Add interactive styles for option tags
                // Interactive option styles are in the single head stylesheet.

                // Track active oscillators for cleanup
                this.activeOscillators = [];

                // Load player data and always show welcome screen
                this.loadPlayerData();

                // Get reference to game board and hide it initially until welcome screen is closed
                this.gameBoard = document.querySelector('.game-board');

                // Always show welcome screen on startup
                this.showWelcomeScreen();
            }

            escapeHTML(value) {
                return String(value).replace(/[&<>"']/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
            }

            // Player data management
            loadPlayerData() {
                let savedData = null;
                try { savedData = localStorage.getItem('musicMatchPlayerData'); } catch (error) { /* storage disabled */ }
                if (savedData) {
                    try {
                        const data = JSON.parse(savedData);
                        this.playerName = data.playerName || '';
                        this.player2Name = data.player2Name || '';
                        this.playerStats = { ...this.playerStats, ...data.playerStats };
                        this.gameStarted = data.gameStarted || false;
                    } catch (e) {
                        console.log('Error loading player data, starting fresh');
                        this.gameStarted = false;
                    }
                } else {
                    this.gameStarted = false;
                }
            }

            savePlayerData() {
                // Don't save stats data when in 2-player mode (call-response mode)
                if (this.callResponseMode) {
                    return;
                }

                const data = {
                    playerName: this.playerName,
                    player2Name: this.player2Name,
                    playerStats: this.playerStats,
                    gameStarted: this.gameStarted
                };
                try { localStorage.setItem('musicMatchPlayerData', JSON.stringify(data)); } catch (error) { /* storage disabled */ }
            }

            updatePlayerStats(gameScore, gameLevel, rhythmAccuracy, pitchAccuracy) {
                // Don't track stats in 2-player mode (call-response mode)
                if (this.callResponseMode) {
                    return;
                }

                this.playerStats.totalGamesPlayed++;
                this.playerStats.bestScore = Math.max(this.playerStats.bestScore, gameScore);
                this.playerStats.bestLevel = Math.max(this.playerStats.bestLevel, gameLevel);

                // Add to session history (keep last 20 sessions)
                this.playerStats.sessionScores.push({
                    score: gameScore,
                    level: gameLevel,
                    date: new Date().toLocaleDateString(),
                    rhythmAccuracy: rhythmAccuracy,
                    pitchAccuracy: pitchAccuracy
                });

                if (this.playerStats.sessionScores.length > 20) {
                    this.playerStats.sessionScores.shift();
                }

                // Track accuracy history (keep last 10 games)
                this.playerStats.rhythmAccuracyHistory.push(rhythmAccuracy);
                this.playerStats.pitchAccuracyHistory.push(pitchAccuracy);

                if (this.playerStats.rhythmAccuracyHistory.length > 10) {
                    this.playerStats.rhythmAccuracyHistory.shift();
                }
                if (this.playerStats.pitchAccuracyHistory.length > 10) {
                    this.playerStats.pitchAccuracyHistory.shift();
                }

                this.savePlayerData();
            }

            // Welcome screen
            showWelcomeScreen() {
                const overlay = document.createElement('div');
                overlay.className = 'game-overlay welcome-overlay';
                const modal = document.createElement('div');
                modal.className = 'welcome-dialog';

                const welcomeMessage = this.playerName ?
                    `Welcome back, <strong>${this.escapeHTML(this.playerName)}</strong>! 🎉` :
                    'Welcome to Copy-Cat! 🎵';

                modal.innerHTML = `
                    <img class="welcome-logo" src="Copycat logo.png" alt="Copy-Cat">
                    
                    <div class="welcome-greeting">
                        ${welcomeMessage}
                    </div>
                    
                    <div class="welcome-instructions">
                        <p><strong>🎮 How to Play:</strong></p>
                        <p>• Listen to the musical pattern and repeat it back</p>
                        <p>• Match both the notes and rhythm timing</p>
                        <p>• Adventure starts with one note, grows the chain, then changes the notes each round</p>
                        <p>• Challenge friends in 2-Player mode! 👥</p>
                    </div>

                    <div id="nameInputSection">
                        <div class="welcome-name-row">
                            <input class="welcome-name-input" type="text" id="playerNameInput" placeholder="Enter your name" 
                                value="${this.escapeHTML(this.playerName)}">
                        </div>
                        
                        <div class="welcome-actions">
                            ${this.playerName ?
                        `<button id="continueAsBtn" style="background: linear-gradient(45deg, #00b894, #00cec9); color: white; border: none; padding: 9px 14px; border-radius: 25px; font-size: 1rem; font-weight: bold; cursor: pointer;">Continue as ${this.escapeHTML(this.playerName)}</button>` :
                        ''
                    }
                            <button id="newPlayerBtn" style="background: linear-gradient(45deg, #fd79a8, #e84393); color: white; border: none; padding: 9px 14px; border-radius: 25px; font-size: 1rem; font-weight: bold; cursor: pointer;">${this.playerName ? 'New Player' : 'Start Playing'}</button>
                            ${this.playerName ?
                        '<button id="viewStatsBtn" style="background: linear-gradient(45deg, #6c5ce7, #a29bfe); color: white; border: none; padding: 9px 14px; border-radius: 25px; font-size: 1rem; font-weight: bold; cursor: pointer;">📊 View Progress</button>' :
                        ''
                    }
                        </div>
                    </div>
                `;

                // Add fade in animation


                overlay.appendChild(modal);
                 document.body.appendChild(overlay);

                // Event listeners
                const nameInput = modal.querySelector('#playerNameInput');
                const continueBtn = modal.querySelector('#continueAsBtn');
                const newPlayerBtn = modal.querySelector('#newPlayerBtn');
                const viewStatsBtn = modal.querySelector('#viewStatsBtn');

                const startGame = (name) => {
                    if (name.trim()) {
                        this.playerName = name.trim();
                        this.gameStarted = true;
                        this.savePlayerData();
                        document.body.removeChild(overlay);
                        this.gameBoard.classList.add('show'); // Show game board after welcome screen
                        this.updateDisplay(); // Update display to show player name
                    } else {
                        nameInput.style.border = '2px solid #e74c3c';
                        nameInput.placeholder = 'Please enter your name!';
                    }
                };

                nameInput.addEventListener('keypress', (e) => {
                    if (e.key === 'Enter') {
                        startGame(nameInput.value);
                    }
                });

                if (continueBtn) {
                    continueBtn.onclick = () => {
                        this.gameStarted = true;
                        this.savePlayerData();
                        document.body.removeChild(overlay);
                        this.gameBoard.classList.add('show'); // Show game board after welcome screen
                        this.updateDisplay();
                    };
                }

                newPlayerBtn.onclick = () => {
                    startGame(nameInput.value);
                };

                if (viewStatsBtn) {
                    viewStatsBtn.onclick = () => {
                        document.body.removeChild(overlay);
                        this.gameBoard.classList.add('show'); // Show game board after welcome screen
                        this.showProgressChart();
                    };
                }
            }

            // Progress chart and statistics
            showProgressChart() {
                const overlay = document.createElement('div');
                overlay.style.cssText = `
                    position: fixed;
                    top: 0;
                    left: 0;
                    width: 100%;
                    height: 100%;
                    background: rgba(0, 0, 0, 0.8);
                    display: flex;
                    justify-content: center;
                    align-items: flex-start;
                    padding: 20px 0;
                    z-index: 10001;
                    backdrop-filter: blur(10px);
                    overflow-y: auto;
                `;

                const modal = document.createElement('div');
                modal.style.cssText = `
                    background: linear-gradient(135deg, #a8e6cf, #88d8c0);
                    border-radius: 20px;
                    padding: 30px;
                    text-align: center;
                    color: #2d3436;
                    border: 3px solid white;
                    box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
                    max-width: 700px;
                    width: 90%;
                    max-height: 90vh;
                    overflow-y: auto;
                `;

                const createProgressBar = (label, percentage, color) => {
                    return `
                        <div style="margin: 15px 0;">
                            <div style="display: flex; justify-content: space-between; margin-bottom: 5px;">
                                <span style="font-weight: bold;">${label}</span>
                                <span>${Math.round(percentage)}%</span>
                            </div>
                            <div style="background: rgba(255,255,255,0.3); border-radius: 10px; height: 20px; overflow: hidden;">
                                <div style="background: ${color}; height: 100%; width: ${percentage}%; transition: width 0.3s ease; border-radius: 10px;"></div>
                            </div>
                        </div>
                    `;
                };

                const createMiniChart = (data, label, color) => {
                    if (!data || data.length === 0) return `<div style="text-align: center; color: #666;">No data yet</div>`;

                    const max = Math.max(...data);
                    const min = Math.min(...data);
                    const range = max - min || 1;

                    return `
                        <div style="margin: 20px 0;">
                            <h4 style="margin-bottom: 10px;">${label}</h4>
                            <div style="display: flex; align-items: end; justify-content: center; gap: 3px; height: 60px; background: rgba(255,255,255,0.2); padding: 10px; border-radius: 10px;">
                                ${data.map(value => {
                        const height = range > 0 ? ((value - min) / range) * 40 + 10 : 25;
                        return `<div style="width: 20px; height: ${height}px; background: ${color}; border-radius: 2px;" title="${Math.round(value)}%"></div>`;
                    }).join('')}
                            </div>
                            <div style="font-size: 0.9rem; margin-top: 5px;">Average: ${Math.round(data.reduce((a, b) => a + b, 0) / data.length)}%</div>
                        </div>
                    `;
                };

                // Calculate averages and convert to percentages for display
                const avgRhythm = this.playerStats.rhythmAccuracyHistory.length > 0 ?
                    (this.playerStats.rhythmAccuracyHistory.reduce((a, b) => a + b, 0) / this.playerStats.rhythmAccuracyHistory.length) * 100 : 0;
                const avgPitch = this.playerStats.pitchAccuracyHistory.length > 0 ?
                    (this.playerStats.pitchAccuracyHistory.reduce((a, b) => a + b, 0) / this.playerStats.pitchAccuracyHistory.length) * 100 : 0;

                modal.innerHTML = `
                    <h2 style="font-size: 2.2rem; margin-bottom: 25px; color: #2d3436;">📊 ${this.playerName}'s Progress 📊</h2>
                    
                    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 25px;">
                        <div style="background: rgba(255,255,255,0.8); padding: 20px; border-radius: 15px;">
                            <h3 style="margin-bottom: 15px; color: #6c5ce7;">🏆 High Scores</h3>
                            <div style="font-size: 1.2rem; margin: 10px 0;"><strong>Best Score:</strong> ${this.playerStats.bestScore.toLocaleString()}</div>
                            <div style="font-size: 1.2rem; margin: 10px 0;"><strong>Best Level:</strong> ${this.playerStats.bestLevel}</div>
                            <div style="font-size: 1.1rem; margin: 10px 0;"><strong>Games Played:</strong> ${this.playerStats.totalGamesPlayed}</div>
                        </div>
                        
                        <div style="background: rgba(255,255,255,0.8); padding: 20px; border-radius: 15px;">
                            <h3 style="margin-bottom: 15px; color: #00b894;">📈 Current Averages</h3>
                            ${createProgressBar('Rhythm Accuracy', avgRhythm, 'linear-gradient(45deg, #667eea, #764ba2)')}
                            ${createProgressBar('Pitch Accuracy', avgPitch, 'linear-gradient(45deg, #00b894, #00cec9)')}
                        </div>
                    </div>

                    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 25px;">
                        <div style="background: rgba(255,255,255,0.8); padding: 20px; border-radius: 15px;">
                            ${createMiniChart(this.playerStats.rhythmAccuracyHistory.map(v => v * 100), '🥁 Rhythm Progress (Last 10 Games)', 'linear-gradient(45deg, #667eea, #764ba2)')}
                        </div>
                        
                        <div style="background: rgba(255,255,255,0.8); padding: 20px; border-radius: 15px;">
                            ${createMiniChart(this.playerStats.pitchAccuracyHistory.map(v => v * 100), '🎵 Pitch Progress (Last 10 Games)', 'linear-gradient(45deg, #00b894, #00cec9)')}
                        </div>
                    </div>

                    ${this.playerStats.sessionScores.length > 0 ? `
                        <div style="background: rgba(255,255,255,0.8); padding: 20px; border-radius: 15px; margin-bottom: 25px;">
                            <h3 style="margin-bottom: 15px; color: #e17055;">📅 Recent Sessions</h3>
                            <div style="max-height: 150px; overflow-y: auto;">
                                ${this.playerStats.sessionScores.slice(-5).reverse().map(session => `
                                    <div style="display: flex; justify-content: space-between; padding: 8px; border-bottom: 1px solid #ddd; font-size: 0.95rem;">
                                        <span>${session.date}</span>
                                        <span>Score: ${session.score.toLocaleString()}</span>
                                        <span>Level: ${session.level}</span>
                                    </div>
                                `).join('')}
                            </div>
                        </div>
                    ` : ''}

                    <div style="display: flex; gap: 15px; justify-content: center; flex-wrap: wrap;">

            async initializeAudio() {
                // Creating an AudioContext is safe here, but resume is always attempted on gesture.
                try {
                    const Context = window.AudioContext || window.webkitAudioContext;
                    if (!Context) return;
                    this.audioContext = new Context();
                    this.masterGain = this.audioContext.createGain();
                    this.masterGain.gain.value = 0.55;
                    this.masterGain.connect(this.audioContext.destination);
                } catch (error) {
                    console.warn('Onboard audio unavailable:', error);
                }
            }

            async resumeAudio() {
                if (this.audioContext && this.audioContext.state === 'suspended') {
                    try { await this.audioContext.resume(); } catch (error) { console.warn('Audio resume:', error); }
                }
            }

            schedule(callback, milliseconds) {
                const id = window.setTimeout(() => { this.pendingTimers.delete(id); callback(); }, milliseconds);
                this.pendingTimers.add(id);
                return id;

            updateMIDIStatus(message) {
                const status = document.getElementById('midiStatus');
                if (!status) return;
                status.textContent = message || (this.midiEnabled
                    ? `MIDI connected · ${this.midiInPort?.name || 'No input'} → ${this.midiOutPort?.name || 'No output'}${this.midiThru ? ' · Thru on' : ''}`
                    : 'Onboard audio ready · MIDI not connected');
            }

            async connectMIDI() {
                if (this.midiRequestPending || !navigator.requestMIDIAccess || !window.isSecureContext) return;
                this.midiRequestPending = true;
                await this.resumeAudio();
                try {
                    this.midiAccess = await navigator.requestMIDIAccess({ sysex: false });
                    this.midiEnabled = true;
                    this.midiAccess.onstatechange = () => this.refreshMIDIPorts();
                    this.refreshMIDIPorts();
                    document.getElementById('connectMidiBtn').textContent = 'Refresh MIDI';
                } catch (error) {
                    this.updateMIDIStatus('MIDI permission denied or not supported. Onboard sound still works.');
                } finally {
                    this.midiRequestPending = false;
                }
            }

            refreshMIDIPorts() {
                if (!this.midiAccess) return;
                const inp = document.getElementById('midiInput');
                const out = document.getElementById('midiOutput');
                const previousIn = this.midiInPort?.id || inp.value;
                const previousOut = this.midiOutPort?.id || out.value;
                const rebuild = (element, ports, none) => {
                    element.replaceChildren(new Option(none, ''));
                    for (const port of ports) element.add(new Option(port.name || port.id, port.id));
                    element.disabled = false;
                };
                rebuild(inp, this.midiAccess.inputs.values(), 'No input');
                rebuild(out, this.midiAccess.outputs.values(), 'No output');
                const inputs = [...this.midiAccess.inputs.values()];
                const outputs = [...this.midiAccess.outputs.values()];
                const chosenIn = inputs.some(p => p.id === previousIn) ? previousIn : (inputs[0]?.id || '');
                const chosenOut = outputs.some(p => p.id === previousOut) ? previousOut : (outputs[0]?.id || '');
                inp.value = chosenIn;
                out.value = chosenOut;
                this.selectMIDIInput(chosenIn);
                this.selectMIDIOutput(chosenOut);
            }

            selectMIDIInput(id) {
                if (this.midiInPort) this.midiInPort.onmidimessage = null;
                this.midiHeld?.clear();
                this.midiInPort = this.midiAccess?.inputs.get(id) || null;
                if (this.midiInPort) this.midiInPort.onmidimessage = this.midiInHandler;
                this.updateMIDIStatus();
            }

            selectMIDIOutput(id) {
                this.allMIDINotesOff();
                this.midiOutPort = this.midiAccess?.outputs.get(id) || null;
                this.updateMIDIStatus();
            }

            handleMIDIMessage(event) {
                const [status, pitch, velocity] = event.data || [];
                const command = status & 0xf0;
                if (pitch < 48 || pitch > 60) return; // C3 through C4, actual MIDI note numbers
                const keyIndex = pitch - 48;
                if (command === 0x90 && velocity > 0) {
                    // Ignore MIDI auto-repeat on a held key; each note-on is scored once.
                    if (this.midiHeld?.has(pitch)) return;
                    if (!this.midiHeld) this.midiHeld = new Set();
                    this.midiHeld.add(pitch);
                    this.onLightPress(keyIndex, null, 'midi');
                } else if (command === 0x80 || (command === 0x90 && velocity === 0)) {
                    this.midiHeld?.delete(pitch);
                    this.onLightRelease(keyIndex, null, 'midi');
                } else return;
                // Optional thru to a *different* port. Same port could create a MIDI feedback loop.
                if (this.midiThru && this.midiOutPort && this.midiInPort?.id !== this.midiOutPort?.id) {
                    try { this.midiOutPort.send([...event.data]); } catch (error) { this.updateMIDIStatus('MIDI output disconnected.'); }
                }
            }

            sendMIDINote(index, on, velocity = 104) {
                const midiPitch = 48 + index;
                if (!this.midiOutPort) return;
                try {
                    this.midiOutPort.send([on ? 0x90 | this.midiOutChannel : 0x80 | this.midiOutChannel, midiPitch, on ? velocity : 0]);
                    if (on) this.midiOnNotes.add(midiPitch);
                    else this.midiOnNotes.delete(midiPitch);
                } catch (error) {
                    this.updateMIDIStatus('MIDI output disconnected; check the selected port.');
                }
            }

            allMIDINotesOff() {
                if (this.midiOutPort) {
                    for (const pitch of this.midiOnNotes) {
                        try { this.midiOutPort.send([0x80 | this.midiOutChannel, pitch, 0]); } catch (error) {}
                    }
                    try { this.midiOutPort.send([0xb0 | this.midiOutChannel, 123, 0]); } catch (error) {}
                }
                this.midiOnNotes.clear();
            }

            // User feedback tone with proper duration matching the rhythm
            playUserFeedbackTone(frequency, rhythmData) {
                if (!this.audioContext || !this.onboardEnabled) return;

                try {
                    // Calculate the full duration this rhythm should have
                    const beatDuration = (60000 / this.bpm); // Keep in milliseconds
                    let subdivisionDuration = beatDuration / rhythmData.taps;

                    // Set minimum subdivision duration to prevent overlapping
                    const minSubdivisionDuration = 150; // Minimum 150ms between notes
                    if (subdivisionDuration < minSubdivisionDuration) {
                        subdivisionDuration = minSubdivisionDuration;
                    }

                    const noteDuration = (subdivisionDuration * 0.6) / 1000; // Convert to seconds, 60% for note

                    // Create Shepard tone with multiple octaves - same as sequence playback
                    const octaves = [1, 2, 4, 8]; // Four octaves
                    const gains = [0.3, 0.4, 0.4, 0.3]; // Bell curve weighting
                    const currentTime = this.audioContext.currentTime;

                    octaves.forEach((octaveMultiplier, index) => {
                        const osc = this.audioContext.createOscillator();
                        const gain = this.audioContext.createGain();

                        // Set frequency for this octave
                        const octaveFreq = frequency * octaveMultiplier;
                        osc.frequency.setValueAtTime(octaveFreq, currentTime);
                        osc.type = 'sine';

                        // Envelope with proper decay length matching the rhythm
                        const maxGain = gains[index] * 0.18; // Slightly louder for user feedback
                        gain.gain.setValueAtTime(0, currentTime);
                        gain.gain.linearRampToValueAtTime(maxGain, currentTime + 0.01);
                        gain.gain.exponentialRampToValueAtTime(maxGain * 0.4, currentTime + noteDuration * 0.5);
                        gain.gain.exponentialRampToValueAtTime(0.001, currentTime + noteDuration);

                        osc.connect(gain);
                        gain.connect(this.masterGain);

                        // Schedule start and stop
                        osc.start(currentTime);
                        osc.stop(currentTime + noteDuration);

                        // Track for cleanup
                        this.activeOscillators.push(osc);

                        // Remove from tracking when it naturally ends
                        osc.onended = () => {
                            const index = this.activeOscillators.indexOf(osc);
                            if (index > -1) {
                                this.activeOscillators.splice(index, 1);
                            }
                        };
                    });

                } catch (e) {
                    console.warn('Audio error:', e);
                }
            }

            // Shepard tone generator with proper note durations
            playTone(frequency, noteDurationMs) {
                if (!this.audioContext || !this.onboardEnabled) return;

                try {
                    // Convert milliseconds to seconds
                    const noteDuration = noteDurationMs / 1000;

                    // Create Shepard tone with multiple octaves
                    const octaves = [1, 2, 4, 8]; // Four octaves
                    const gains = [0.3, 0.4, 0.4, 0.3]; // Bell curve weighting
                    const currentTime = this.audioContext.currentTime;

                    octaves.forEach((octaveMultiplier, index) => {
                        const osc = this.audioContext.createOscillator();
                        const gain = this.audioContext.createGain();

                        // Set frequency for this octave
                        const octaveFreq = frequency * octaveMultiplier;
                        osc.frequency.setValueAtTime(octaveFreq, currentTime);
                        osc.type = 'sine';

                        // Envelope with decay
                        const maxGain = gains[index] * 0.12; // Reduced volume further
                        gain.gain.setValueAtTime(0, currentTime);
                        gain.gain.linearRampToValueAtTime(maxGain, currentTime + 0.01);
                        gain.gain.exponentialRampToValueAtTime(maxGain * 0.4, currentTime + noteDuration * 0.5);
                        gain.gain.exponentialRampToValueAtTime(0.001, currentTime + noteDuration);

                        osc.connect(gain);
                        gain.connect(this.masterGain);

                        // Schedule start and stop
                        osc.start(currentTime);
                        osc.stop(currentTime + noteDuration);

                        // Track for cleanup
                        this.activeOscillators.push(osc);

                        // Remove from tracking when it naturally ends
                        osc.onended = () => {
                            const index = this.activeOscillators.indexOf(osc);
                            if (index > -1) {
                                this.activeOscillators.splice(index, 1);
                            }
                        };
                    });

                } catch (e) {
                    console.warn('Audio error:', e);
                }
            }

            // Update custom scale based on note checkboxes
            updateCustomScale() {
                this.customNotes = [];
                const noteMap = {
                    'C': 'C', 'Csharp': 'C#', 'D': 'D', 'Dsharp': 'D#',
                    'E': 'E', 'F': 'F', 'Fsharp': 'F#', 'G': 'G',
                    'Gsharp': 'G#', 'A': 'A', 'Asharp': 'A#', 'B': 'B', 'C4': 'C4'
                };

                Object.keys(noteMap).forEach(checkboxId => {
                    const checkbox = document.getElementById(`note${checkboxId}`);
                    if (checkbox && checkbox.checked) {
                        this.customNotes.push(noteMap[checkboxId]);
                    }
                });

                // Ensure at least one note is selected
                if (this.customNotes.length === 0) {
                    this.customNotes.push('C');
                    document.getElementById('noteC').checked = true;
                }

                this.updateNoteDisplay();
            }

            // Update note display based on available notes
            updateNoteDisplay() {
                const selecting = this.customNoteSelectionMode;
                const allowed = new Set(selecting ? this.customNotes : this.getAvailableNotesForLevel(this.currentLevel));
                const container = document.getElementById('pianoKeyboard');
                if (!container) return;
                container.classList.toggle('custom-note-selection-mode', selecting);
                document.querySelectorAll('.light').forEach(key => {
                    const included = allowed.has(key.dataset.note);
                    key.classList.toggle('out-of-scale', !included);
                    key.classList.toggle('ghosted', selecting && !included);
                    key.classList.toggle('selected', selecting && included);
                    // Keep every key on screen with stable dimensions, even when unavailable.
                    key.style.removeProperty('display');
                    key.style.removeProperty('opacity');
                    key.style.removeProperty('pointer-events');
                });
                document.getElementById('keyboardHint').textContent = selecting ? 'Choose your notes, then Save My Notes' :
                    (this.gameState === 'playing' ? 'Listen to the pattern' : this.gameState === 'listening' ? 'Copy the pattern' : 'Tap a key to hear it');
                if (selecting) this.showSaveCustomNotesButton();
                else this.hideSaveCustomNotesButton();
            }

            // Each Adventure round defines a note pool and target chain length.
            // The actual note order is shuffled, so repeated games are not scripted.
            getAdventureNotes(round = this.currentRound) {
                const opening = [
                    ['C', 'E', 'G'], ['F', 'A', 'C'], ['G', 'B', 'D'],
                    ['E', 'F', 'B', 'C'], ['A', 'F', 'C', 'B'], ['D', 'F', 'E', 'B', 'A']
                ];
                if (round <= opening.length) return [...opening[Math.max(0, round - 1)]];
                const pool = ['C', 'D', 'E', 'F', 'G', 'A', 'B'];
                const additions = [
                    [11, 'F#'], [16, 'A#'], [21, 'C#'],
                    [26, 'D#'], [31, 'G#'], [36, 'C4']
                ];
                additions.forEach(([at, note]) => { if (round >= at) pool.push(note); });
                return pool;
            }

            getAdventureTargetLength(round = this.currentRound) {
                const openingLengths = [3, 3, 3, 4, 4, 5];
                return round <= 6 ? openingLengths[Math.max(0, round - 1)] :
                    Math.min(10, 5 + Math.floor((round - 6) / 6));
            }

            getAdventureRhythms(round = this.currentRound) {
                // Introduce one more selected rhythm each round. A set of 3
                // appears in full by round 3, and a set of 4 by round 4.
                const order = ['quarter', 'eighth', 'triplet', 'sixteenth'];
                const selected = order.filter(name => this.enabledRhythms.includes(name));
                const rhythms = selected.length ? selected : ['quarter'];
                return rhythms.slice(0, Math.min(Math.max(1, round), rhythms.length));
            }

            generateAdventureSequence(round = this.currentRound) {
                const pool = this.getAdventureNotes(round);
                const length = this.getAdventureTargetLength(round);
                const notes = [];
                // Shuffle each group of pitches so notes do not repeat within a group.
                // When the chain is longer than the pool, reshuffle and continue.
                while (notes.length < length) {
                    const bag = [...pool];
                    for (let i = bag.length - 1; i > 0; i--) {
                        const j = Math.floor(Math.random() * (i + 1));
                        [bag[i], bag[j]] = [bag[j], bag[i]];
                    }
                    if (bag.length > 1 && (notes.length ? notes[notes.length - 1] : this.lastAdventureFirstNote) === bag[0]) {
                        const swap = bag.findIndex(note => note !== bag[0]);
                        [bag[0], bag[swap]] = [bag[swap], bag[0]];
                    }
                    notes.push(...bag.slice(0, length - notes.length));
                }
                this.lastAdventureFirstNote = notes[0];
                const rhythms = this.getAdventureRhythms(round);
                const selected = ['quarter', 'eighth', 'triplet', 'sixteenth']
                    .filter(name => this.enabledRhythms.includes(name));
                const introduced = selected[Math.min(round, Math.max(1, selected.length)) - 1] || 'quarter';
                const chromatic = ['C','C#','D','D#','E','F','F#','G','G#','A','A#','B','C4'];
                return notes.map((note, index) => {
                    // Guarantee the newly introduced selected rhythm is actually heard.
                    const rhythm = index === 0 && round <= selected.length ? introduced :
                        rhythms[Math.floor(Math.random() * rhythms.length)];
                    return { lightIndex: chromatic.indexOf(note), note, rhythm,
                        rhythmData: this.rhythms[rhythm] };
                });
            }

            beginAdventureRound() {
                this.adventureTargetSequence = this.generateAdventureSequence(this.currentRound);
                this.gameSequence = this.adventureTargetSequence.slice(0, 1);
                this.playerSequence = [];
                this.currentSequenceIndex = 0;
                this.currentTapCount = 0;
                this.currentItemTapTimes = [];
                this.isPlayerTurn = false;
                this.sequenceCompletionPending = false;
                this.updateNoteDisplay();
                this.updateDisplay();
                this.updateControls();
            }

            advanceAdventureChain() {
                if (this.gameState === 'stopped' || this.gameMode !== 'adventure') return;
                if (!this.adventureTargetSequence || this.gameSequence.length >= this.adventureTargetSequence.length) return;
                this.gameSequence.push(this.adventureTargetSequence[this.gameSequence.length]);
                this.playerSequence = [];
                this.currentSequenceIndex = 0;
                this.currentTapCount = 0;
                this.currentItemTapTimes = [];
                this.isPlayerTurn = false;
                this.sequenceCompletionPending = false;
                this.gameState = 'playing';
                this.updateDisplay();
                this.updateControls();
                this.playSequence();
            }

            getRhythmDifficulty(sequence = this.gameSequence) {
                // Reward the rhythms actually reproduced and additional variety;
                // selecting every box without playing those rhythms grants no bonus.
                const weights = {quarter:1, eighth:1.5, triplet:2.25, sixteenth:3};
                if (!sequence.length) return 1;
                const distinct = new Set(sequence.map(item => item.rhythm));
                const average = sequence.reduce((sum, item) =>
                    sum + (weights[item.rhythm] || 1), 0) / sequence.length;
                return Math.round((average + (distinct.size - 1) * 0.35) * 100) / 100;
            }

            awardAdventureRound() {
                const noteCount = this.gameSequence.length;
                const noteDifficulty = Math.max(1, this.getAdventureNotes(this.currentRound).length - 2);
                const rhythmDifficulty = this.getRhythmDifficulty();
                const accuracyBonus = this.rhythmAccuracy >= .9 ? 90 :
                    this.rhythmAccuracy >= .75 ? 65 : this.rhythmAccuracy >= .55 ? 35 : 0;
                const points = Math.round((100 + 50 * noteCount + accuracyBonus) *
                    noteDifficulty * rhythmDifficulty);
                this.levelScore = points;
                this.totalScore += points;
                this.updateDisplay();
                return points;
            }

            // Get available notes for current level
            getAvailableNotesForLevel(level = null) {
                if (this.usingCustomScale) {
                    return this.customNotes;
                }
                if (this.gameMode === 'adventure') return this.getAdventureNotes(this.currentRound);
                // Pitch Training and custom notes retain their existing level progression.
                const currentLevel = level || this.currentLevel;
                const clampedLevel = Math.max(1, Math.min(currentLevel, 20));
                return this.levelNotes[clampedLevel] || this.levelNotes[20];
            }

            // Show save button for custom note selection
            showSaveCustomNotesButton() {
                // Remove existing button if present
                const existingBtn = document.getElementById('saveCustomNotesBtn');
                if (existingBtn) {
                    existingBtn.remove();
                }

                const saveBtn = document.createElement('button');
                saveBtn.id = 'saveCustomNotesBtn';
                saveBtn.className = 'save-custom-notes-btn';
                saveBtn.innerHTML = '💾 Save My Notes';
                saveBtn.onclick = () => this.saveCustomNotes();
                document.body.appendChild(saveBtn);
            }

            // Hide save button
            hideSaveCustomNotesButton() {
                const saveBtn = document.getElementById('saveCustomNotesBtn');
                if (saveBtn) {
                    saveBtn.remove();
                }
            }

            // Handle note light click in custom selection mode
            handleCustomNoteSelection(noteIndex) {
                if (!this.customNoteSelectionMode) return;

                const chromaticScale = ['C', 'C#', 'D', 'D#', 'E', 'F', 'F#', 'G', 'G#', 'A', 'A#', 'B', 'C4'];
                const note = chromaticScale[noteIndex];
                const light = document.getElementById(`light-${noteIndex}`);

                if (this.customNotes.includes(note)) {
                    // Remove note
                    this.customNotes = this.customNotes.filter(n => n !== note);
                    light.classList.remove('selected');
                    light.classList.add('ghosted');
                } else {
                    // Add note
                    this.customNotes.push(note);
                    light.classList.remove('ghosted');
                    light.classList.add('selected');
                }

                // Ensure at least one note is selected
                if (this.customNotes.length === 0) {
                    this.customNotes.push('C');
                    const cLight = document.getElementById('light-0');
                    cLight.classList.remove('ghosted');
                    cLight.classList.add('selected');
                }

                // Update the custom scale checkboxes to match
                this.syncCustomNotesToCheckboxes();
            }

            // Save custom notes and exit selection mode
            saveCustomNotes() {
                this.customNoteSelectionMode = false;
                this.updateNoteDisplay();
                this.updateOptionsIndicator();

                // Update the custom scale container visibility
                const customContainer = document.getElementById('customScaleContainer');
                customContainer.style.display = 'none';

                // Show success message
                this.showCustomNotesSavedMessage();
            }

            // Show success message for saved notes
            showCustomNotesSavedMessage() {
                const message = document.createElement('div');
                message.style.cssText = `
                    position: fixed;
                    top: 50%;
                    left: 50%;
                    transform: translate(-50%, -50%);
                    background: linear-gradient(135deg, #00b894, #00cec9);
                    color: white;
                    padding: 20px 40px;
                    border-radius: 20px;
                    font-size: 1.2rem;
                    font-weight: bold;
                    box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
                    z-index: 10001;
                    border: 3px solid white;
                    font-family: 'Comic Sans MS', sans-serif;
                `;
                message.textContent = `✅ Saved ${this.customNotes.length} notes: ${this.customNotes.join(', ')}`;
                document.body.appendChild(message);

                this.schedule(() => {
